name: Windows Build, MSI Installer & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a new GitHub Release tag (example: v2.0.1). Leave blank for build-only."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build EXE and MSI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Validate release tag input
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$env:RELEASE_TAG'. Use vMAJOR.MINOR.PATCH, for example v2.0.1."
          }
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify whether the release tag exists on origin."
          }
          if ($existing) {
            throw "Tag '$env:RELEASE_TAG' already exists. Choose a new version; existing tags are never overwritten."
          }
          Write-Host "Release tag is valid and unused: $env:RELEASE_TAG"

      - name: Validate required project inputs
        shell: pwsh
        run: |
          $required = @(
            "build.bat",
            "quick-screen-recorder\quick-screen-recorder.csproj",
            "quick-screen-recorder\rec.ico",
            "packages\QuickLibrary\QuickLibrary.dll",
            "packages\NAudio.1.10.0\lib\net35\NAudio.dll",
            "packages\Octokit.0.3.4\lib\net45\Octokit.dll",
            "packages\SharpAvi.2.1.2\lib\net45\SharpAvi.dll",
            "installer\LiteScreenRecorder.wxs"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw ("Required build inputs missing:`n" + ($missing -join "`n"))
          }
          Write-Host "All required build inputs are present."

      - name: Build Windows application
        shell: cmd
        run: build.bat --nopause

      - name: Verify EXE and runtime dependencies
        shell: pwsh
        run: |
          $buildOutput = "quick-screen-recorder\bin\Release"
          $required = @(
            "Lite-Screen-Recorder.exe",
            "Lite-Screen-Recorder.exe.config",
            "NAudio.dll",
            "Octokit.dll",
            "QuickLibrary.dll",
            "SharpAvi.dll",
            "rec.ico"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $buildOutput $_)) }
          if ($missing) {
            throw ("Build output is incomplete:`n" + ($missing -join "`n"))
          }

          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null
          Copy-Item (Join-Path $buildOutput "Lite-Screen-Recorder.exe") `
            "release_artifacts\Lite-Screen-Recorder.exe" -Force

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix --version

      - name: Build MSI installer
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v2.0.0' }}
        run: |
          $buildOutput = (Resolve-Path "quick-screen-recorder\bin\Release").Path
          $projectRoot = (Get-Location).Path

          if ($env:PRODUCT_VERSION -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $version = "2.0.0"
          }

          Write-Host "Building MSI version $version"
          wix build -arch x64 `
            -d "BuildOutput=$buildOutput" `
            -d "ProductVersion=$version" `
            -d "ProjectRoot=$projectRoot" `
            -o "release_artifacts\LiteScreenRecorder-Setup.msi" `
            "installer\LiteScreenRecorder.wxs"

          if (-not (Test-Path "release_artifacts\LiteScreenRecorder-Setup.msi")) {
            throw "WiX did not produce the MSI package."
          }

          $msi = Get-Item "release_artifacts\LiteScreenRecorder-Setup.msi"
          if ($msi.Length -lt 100KB) {
            throw "MSI output is unexpectedly small ($($msi.Length) bytes)."
          }
          Write-Host "MSI created: $($msi.Length) bytes"

      - name: Verify final release files
        shell: pwsh
        run: |
          $files = @(
            "release_artifacts\Lite-Screen-Recorder.exe",
            "release_artifacts\LiteScreenRecorder-Setup.msi"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            $item = Get-Item $file
            if ($item.Length -le 0) { throw "Empty release file: $file" }
            Write-Host ("{0} — {1:N0} bytes" -f $item.Name, $item.Length)
          }

      - name: Upload EXE and MSI as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lite-Screen-Recorder-Windows-${{ github.run_number }}
          path: |
            release_artifacts/Lite-Screen-Recorder.exe
            release_artifacts/LiteScreenRecorder-Setup.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Lite Screen Recorder ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_artifacts/Lite-Screen-Recorder.exe
            release_artifacts/LiteScreenRecorder-Setup.msi
