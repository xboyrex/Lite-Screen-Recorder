name: Super-Fast Build & Auto-Release (Lite Screen Recorder)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional Release Tag to publish (e.g. v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-package:
    name: Fast Windows Build (.exe + .msi + .zip) (@xboyrex)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure Bundled Libraries
        run: |
          if (!(Test-Path "packages\QuickLibrary\QuickLibrary.dll")) {
            New-Item -ItemType Directory -Force -Path "packages\QuickLibrary" | Out-Null
            if (Test-Path "quick-screen-recorder\bin\Release\QuickLibrary.dll") {
              Copy-Item "quick-screen-recorder\bin\Release\QuickLibrary.dll" "packages\QuickLibrary\QuickLibrary.dll" -Force
            }
          }

      - name: Build Lite Screen Recorder & Setup Installer
        run: |
          cmd /c build.bat --nopause

      - name: Stage Release Artifacts (.exe, Setup.exe, .msi, Portable.zip)
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null
          Copy-Item "quick-screen-recorder\bin\Release\Lite-Screen-Recorder.exe" "release_artifacts\Lite-Screen-Recorder.exe" -Force
          if (Test-Path "QuickScreenRecorder-Setup\Release\LiteScreenRecorder-Setup.exe") {
            Copy-Item "QuickScreenRecorder-Setup\Release\LiteScreenRecorder-Setup.exe" "release_artifacts\LiteScreenRecorder-Setup.exe" -Force
          }
          if (Test-Path "QuickScreenRecorder-Setup\Release\Lite-Screen-Recorder-Portable.zip") {
            Copy-Item "QuickScreenRecorder-Setup\Release\Lite-Screen-Recorder-Portable.zip" "release_artifacts\Lite-Screen-Recorder-Portable.zip" -Force
          }
          if (Test-Path "QuickScreenRecorder-Setup\Release\LiteScreenRecorder-Setup.msi") {
            Copy-Item "QuickScreenRecorder-Setup\Release\LiteScreenRecorder-Setup.msi" "release_artifacts\LiteScreenRecorder-Setup.msi" -Force
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lite-Screen-Recorder-Windows-Release
          path: release_artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release (on Tag or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          name: "Lite Screen Recorder ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }} — by Mayank Droid (@xboyrex)"
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            release_artifacts/*
            icon.svg
